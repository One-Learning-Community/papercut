<p>The identity <math xmlns="http://www.w3.org/1998/Math/MathML"><msup><mi>sin</mi><mn>2</mn></msup><mo>&#xA0;</mo><mi>&#x3B8;</mi><mo>+</mo><msup><mi>cos</mi><mn>2</mn></msup><mo>&#xA0;</mo><mi>&#x3B8;</mi><mo>=</mo><mn>1</mn></math> holds for every angle, and <math xmlns="http://www.w3.org/1998/Math/MathML"><mover><mi>x</mi><mo>&#xAF;</mo></mover><mo>=</mo><mfrac><mrow><munderover><mo>&#x2211;</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><msub><mi>x</mi><mi>i</mi></msub></mrow><mi>n</mi></mfrac></math> is the mean.</p>
