name: docx

on:
  push:
    branches: [main]
    paths: &paths
      - 'packages/docx/**'
      - 'packages/core/**'
      - 'packages/math/**'
      - 'examples/docx/**'
      - 'examples/core/documents/**'
      - '.github/workflows/docx.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docx-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    defaults:
      run:
        working-directory: packages/docx
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zlib, dom, gd, zip, imagick
          coverage: none
          tools: composer:v2
      - name: Install poppler, LibreOffice Writer and rsvg-convert
        run: sudo apt-get update && sudo apt-get install -y poppler-utils libreoffice-writer librsvg2-bin
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-docx-${{ matrix.php }}-${{ hashFiles('packages/*/composer.json') }}
          restore-keys: composer-docx-${{ matrix.php }}-
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: Render the examples
        working-directory: .
        run: php examples/docx/render.php
      - name: Validate against the OOXML schemas
        working-directory: examples/docx
        run: for f in *.docx; do echo "$f"; npx --yes @xarsh/ooxml-validator@0.4.0 "$f"; done
      - name: Convert with LibreOffice and render pages
        working-directory: examples/docx
        run: |
          soffice --headless --convert-to pdf --outdir lo *.docx
          for f in lo/*.pdf; do pdftoppm -r 60 -png "$f" "${f%.pdf}"; done
      - uses: actions/upload-artifact@v7
        if: always() && matrix.php == '8.4'
        with:
          name: docx-examples
          path: |
            examples/docx/*.docx
            examples/docx/lo/*.png
          if-no-files-found: ignore

  bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/docx
    env:
      PAPERCUT_BENCH_MACHINE: ci-ubuntu-latest
      PAPERCUT_BENCH_TIMINGS: warn
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, zlib, dom, zip, opcache
          ini-values: opcache.enable_cli=1
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --no-dev --classmap-authoritative
      - name: Benchmark (Word export of core's prose article with and without TOC page numbers, and the 10-page table)
        run: php -d opcache.enable_cli=1 bench/run.php | tee bench-result.json
      - name: Compare with the committed baseline (memory peaks and page counts fail if off; timings > 20% slower warn, as runner speed varies)
        run: PAPERCUT_BASELINE=bench/baseline.json php ../core/bench/check.php bench-result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-docx
          path: |
            packages/docx/bench-result.json
            packages/docx/bench/baseline.json
