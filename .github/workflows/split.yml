# Mirrors each package into its own read-only repository, which is what Packagist reads
# (Packagist takes one composer.json per repository). Runs on every push to main, so the
# split repos' dev-main stays current. Tagged releases are split by release.yml.
#
# Needs the SPLIT_TOKEN secret: a fine-grained token with "Contents: read and write" on
# One-Learning-Community/papercut-core, papercut-laravel and papercut-docx.
# Without it the job skips with a notice instead of failing.
name: split

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: split
  cancel-in-progress: false

jobs:
  split:
    uses: ./.github/workflows/split-packages.yml
    with:
      branch: main
    secrets: inherit
