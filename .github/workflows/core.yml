name: core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zlib, dom, gd, imagick
          coverage: none
          tools: composer:v2
      - name: Install qpdf and poppler
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-core-${{ matrix.php }}-${{ hashFiles('packages/core/composer.json') }}
          restore-keys: composer-core-${{ matrix.php }}-
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: Upload visual diff images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-output-php${{ matrix.php }}
          path: packages/core/tests/Visual/output/
          if-no-files-found: ignore

  # Renders the core examples as tagged PDFs and validates them against PDF/UA-1 with veraPDF.
  # Needs the php-pdf release with PDF/UA support. While composer.json still allows an older php-pdf,
  # tagging falls back to untagged with a warning and this check would fail, so it skips itself
  # (with a warning annotation) until the requirement is raised.
  tagged-pdf:
    name: tagged PDF (PDF/UA-1, veraPDF)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, zlib, dom, gd, imagick
          coverage: none
          tools: composer:v2
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-core-8.4-${{ hashFiles('packages/core/composer.json') }}
          restore-keys: composer-core-8.4-
      - run: composer install --no-interaction --no-progress
      - name: Check php-pdf PDF/UA support
        id: ua
        run: |
          missing=$(php -r 'require "vendor/autoload.php"; echo implode(", ", Papercut\Backend\PhpPdf\TaggingSupport::missing());')
          if [ -n "$missing" ]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Tagged PDF validation SKIPPED::The installed php-pdf lacks PDF/UA support ($missing). Raise the php-pdf requirement to the release that has it; this check then runs on its own."
          else
            echo "supported=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Render the examples tagged (any warning fails)
        if: steps.ua.outputs.supported == 'true'
        run: php tools/render-tagged-examples.php ../../build/tagged-core
      - name: Validate against PDF/UA-1 (veraPDF)
        if: steps.ua.outputs.supported == 'true'
        run: php tools/verapdf-ua1.php ../../build/tagged-core ../../build/tagged-core-report.json
      - name: Upload PDFs and veraPDF report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tagged-core
          path: |
            build/tagged-core/
            build/tagged-core-report.json
          if-no-files-found: ignore

  bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    env:
      PAPERCUT_BENCH_MACHINE: ci-ubuntu-latest
      PAPERCUT_BENCH_TIMINGS: warn
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, zlib, dom, opcache
          ini-values: opcache.enable_cli=1
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --no-dev --classmap-authoritative
      - name: Benchmark (10-page table as PDF and HTML, 20-page prose article as PDF; median of 5 runs after 1 warm-up)
        run: php -d opcache.enable_cli=1 bench/run.php | tee bench-result.json
      - name: Compare with the committed baseline (memory peaks and page counts fail if off; timings > 20% slower warn, as runner speed varies)
        run: php bench/check.php bench-result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench
          path: |
            packages/core/bench-result.json
            packages/core/bench/baseline.json
