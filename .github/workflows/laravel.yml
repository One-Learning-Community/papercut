name: laravel

on:
  push:
    branches: [main]
    paths: &paths
      - 'packages/laravel/**'
      - 'packages/core/**'
      - 'examples/laravel/**'
      - '.github/workflows/laravel.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: laravel-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Laravel ${{ matrix.laravel }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['13', '12']
        php: ['8.4', '8.5']
    defaults:
      run:
        working-directory: packages/laravel
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zlib, dom, gd
          coverage: none
          tools: composer:v2
      - name: Install qpdf and poppler
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-laravel${{ matrix.laravel }}-${{ matrix.php }}-${{ hashFiles('packages/*/composer.json') }}
          restore-keys: composer-laravel${{ matrix.laravel }}-${{ matrix.php }}-
      - name: Pin Laravel 12 line
        if: matrix.laravel == '12'
        run: composer require laravel/framework:^12.0 orchestra/testbench:^10.16 phpunit/phpunit:^12.5 -W --dev --no-interaction --no-progress
      - name: Install dependencies
        if: matrix.laravel != '12'
        run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: PHPStan
        if: matrix.laravel != '12'
        run: vendor/bin/phpstan analyse --memory-limit=1G
