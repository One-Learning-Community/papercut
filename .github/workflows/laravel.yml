name: laravel

on:
  push:
    branches: [main]
    paths: &paths
      - 'packages/laravel/**'
      - 'packages/core/**'
      - 'packages/docx/**'
      - 'examples/laravel/**'
      - '.github/workflows/laravel.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: laravel-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Laravel ${{ matrix.laravel }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['13', '12']
        php: ['8.4', '8.5']
    defaults:
      run:
        working-directory: packages/laravel
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zlib, dom, gd, zip
          coverage: none
          tools: composer:v2
      - name: Install qpdf and poppler
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-laravel${{ matrix.laravel }}-${{ matrix.php }}-${{ hashFiles('packages/*/composer.json') }}
          restore-keys: composer-laravel${{ matrix.laravel }}-${{ matrix.php }}-
      - name: Pin Laravel 12 line
        if: matrix.laravel == '12'
        run: composer require laravel/framework:^12.0 orchestra/testbench:^10.16 phpunit/phpunit:^12.5 -W --dev --no-interaction --no-progress
      - name: Install dependencies
        if: matrix.laravel != '12'
        run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: PHPStan
        if: matrix.laravel != '12'
        run: vendor/bin/phpstan analyse --memory-limit=1G

  # Renders the example views tagged and as PDF/A-2u and 2a, and validates them with veraPDF (the script lives in
  # packages/core/tools). Needs the php-pdf release with PDF/UA support; skips itself, with a warning
  # annotation, while the installed php-pdf lacks it (see core.yml).
  validate-pdf:
    name: ${{ matrix.name }} (veraPDF)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tagged PDF (PDF/UA-1)
            slug: ua1
            render: --tagged
            flavours: ua1
          - name: PDF/A-2u
            slug: pdfa-2u
            render: --pdfa=2u
            flavours: 2u
          - name: PDF/A-2a (tagged)
            slug: pdfa-2a
            render: --pdfa=2a
            flavours: 2a ua1
    defaults:
      run:
        working-directory: packages/laravel
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, zlib, dom, gd, zip
          coverage: none
          tools: composer:v2
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-laravel13-8.4-${{ hashFiles('packages/*/composer.json') }}
          restore-keys: composer-laravel13-8.4-
      - run: composer install --no-interaction --no-progress
      - name: Check php-pdf PDF/UA support (PDF/A validation needs it too)
        id: ua
        run: |
          missing=$(php -r 'require "vendor/autoload.php"; echo implode(", ", Papercut\Backend\PhpPdf\TaggingSupport::missing());')
          if [ -n "$missing" ]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=PDF validation SKIPPED::The installed php-pdf lacks PDF/UA support ($missing). Raise the php-pdf requirement to the release that has it; this check then runs on its own."
          else
            echo "supported=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Render the example views (any warning fails)
        if: steps.ua.outputs.supported == 'true'
        run: php tools/render-examples.php ../../build/${{ matrix.slug }}-laravel ${{ matrix.render }}
      - name: Validate against ${{ matrix.flavours }} (veraPDF)
        if: steps.ua.outputs.supported == 'true'
        run: |
          rc=0
          for flavour in ${{ matrix.flavours }}; do
            php ../core/tools/verapdf.php "$flavour" ../../build/${{ matrix.slug }}-laravel "../../build/${{ matrix.slug }}-laravel-$flavour-report.json" || rc=1
          done
          exit $rc
      - name: Upload PDFs and veraPDF report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.slug }}-laravel
          path: |
            build/${{ matrix.slug }}-laravel/
            build/${{ matrix.slug }}-laravel-*-report.json
          if-no-files-found: ignore
